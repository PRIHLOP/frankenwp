name: PR

# Build check for pull requests.
#
# The release workflows (php-8_2.yaml, php-8_3.yml, php-8_4.yml, php-8_5.yml)
# only run on pushes to main, on tags and on a schedule. This workflow builds
# the image for every pull request so that a broken Dockerfile is caught
# before it reaches main.
#
# It deliberately differs from the release workflows:
#
#   * it never pushes an image
#   * it builds a single platform (linux/amd64) instead of three, because
#     the emulation of the other architectures takes several times longer and
#     adds nothing to the "does it build" check
#   * it runs a smoke test against the built image
#   * every PHP version gets its own cache scope, so the four jobs do not
#     overwrite each other's cache

on:
  pull_request:
    branches: ["main"]

# A new push to the same branch cancels the previous run: only the newest
# commit is worth building.
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Run all four PHP versions, but never queue more than two builds at a
      # time so that a pull request does not monopolize the runner pool.
      fail-fast: false
      max-parallel: 2
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Build the image. The result is loaded into the local Docker daemon so
      # that the smoke test can run it.
      - name: Build the image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: frankenwp:pr-php${{ matrix.php }}
          cache-from: type=gha,scope=php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            FRANKENPHP_VERSION=${{ vars.FRANKENPHP_VERSION || '1.13.2' }}

      # Verify that the built image actually works, not just that it builds.
      - name: Smoke test the image
        run: ./scripts/smoke-test.sh "frankenwp:pr-php${{ matrix.php }}" 18080
